name: Docker Hub mirror
description: Pull Docker Hub images through mirror.gcr.io (no anonymous pull limit).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        f=/etc/docker/daemon.json
        cur=$(sudo cat "$f" 2>/dev/null || echo '{}')
        jq '."registry-mirrors" = ["https://mirror.gcr.io"]' <<<"$cur" | sudo tee "$f" >/dev/null
        sudo systemctl restart docker
        docker info -f '{{.RegistryConfig.Mirrors}}'
